<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>远程桌面 – {{ username }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; overflow: hidden;
                 background: #111; font-family: system-ui, sans-serif; }

    /* ── 顶栏 ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 36px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; padding: 0 12px;
      gap: 10px;
      transition: opacity .3s;
    }
    #topbar:hover { opacity: 1 !important; }
    #topbar.hidden { opacity: 0; pointer-events: none; }
    .bar-title { color: rgba(255,255,255,0.7); font-size: 13px; flex: 1; }
    .bar-btn {
      padding: 4px 12px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 12px; font-weight: 600;
    }
    #btnFullscreen { background: #0288d1; color: #fff; }
    #btnClipboard  { background: #37474f; color: #ccc; position: relative; }
    #btnClipboard.active,
    #btnClipboard.has-new { background: #00897b; color: #fff; }
    #btnLogout     { background: #c62828; color: #fff; }
    .badge {
      display: inline-block; margin-left: 5px; padding: 0 5px;
      min-width: 15px; border-radius: 8px; background: #ff5252; color: #fff;
      font-size: 10px; line-height: 15px; text-align: center;
    }

    /* ── 状态覆盖层 ── */
    #overlay {
      position: fixed; inset: 0; z-index: 200;
      background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    #overlay.hidden { display: none; }
    .spinner-ring {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #statusMsg { color: rgba(255,255,255,0.65); font-size: 15px; }
    #errorMsg  { color: #ef9a9a; font-size: 14px; display: none; }

    /* ── noVNC canvas 容器 ── */
    #vnc-container {
      position: fixed;
      top: 36px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
    }
    /* noVNC 自己管理 canvas，我们只需给它一个全尺寸容器 */
    #vnc-container canvas {
      display: block;
    }

    /* ── 剪贴板面板 ── */
    #clipPanel {
      display: none;
      position: fixed; top: 44px; right: 10px; z-index: 150;
      background: #263238; border: 1px solid #37474f; border-radius: 8px;
      padding: 10px; width: 340px; max-width: calc(100vw - 20px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #clipPanel.open { display: block; }
    .clip-head {
      display: flex; align-items: center; justify-content: space-between;
      color: #cfd8dc; font-size: 13px; font-weight: 600; margin-bottom: 8px;
    }
    .clip-x {
      background: none; border: none; color: #90a4ae; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0 2px;
    }
    .clip-x:hover { color: #fff; }
    .clip-hint {
      font-size: 11px; line-height: 1.55; border-radius: 5px;
      padding: 6px 8px; margin-bottom: 8px; color: #b0bec5;
      background: #1c262b; border: 1px solid #37474f;
    }
    .clip-hint.ok { border-color: #2e7d32; color: #a5d6a7; }
    .clip-hint.warn { border-color: #ef6c00; color: #ffcc80; }
    #clipText {
      width: 100%; height: 96px; background: #1c262b; color: #cfd8dc;
      border: 1px solid #455a64; border-radius: 4px; resize: vertical;
      font-size: 13px; padding: 6px; font-family: inherit;
    }
    #clipText:focus { outline: 1px solid #4fc3f7; }
    .clip-actions { display: flex; gap: 6px; margin-top: 8px; }
    .clip-actions button {
      flex: 1; padding: 6px; background: #37474f; color: #eceff1;
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .clip-actions button.primary { background: #0288d1; color: #fff; }
    .clip-actions button:hover { filter: brightness(1.15); }
    .clip-foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 8px; color: #90a4ae; font-size: 11px;
    }
    .clip-foot label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .clip-status { color: #80cbc4; text-align: right; flex: 1; }
    .clip-status.error { color: #ef9a9a; }

    /* ── Toast 通知 ── */
    #toasts {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      z-index: 300; display: flex; flex-direction: column; gap: 8px;
      align-items: center; pointer-events: none; max-width: calc(100vw - 24px);
    }
    .toast {
      pointer-events: auto; display: flex; align-items: center; gap: 10px;
      background: #263238; color: #eceff1; border: 1px solid #455a64;
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      animation: toast-in .18s ease-out;
    }
    .toast.error { border-color: #b71c1c; color: #ffcdd2; }
    .toast.out { opacity: 0; transform: translateY(6px); transition: all .2s; }
    .toast button {
      background: #0288d1; color: #fff; border: none; border-radius: 4px;
      padding: 4px 10px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    /* 剪贴板捕获用的隐藏输入框：不能 display:none，否则无法获得焦点 */
    #clipScratch {
      /* macOS/Safari 对“不可见/屏幕外”的输入框会拒绝粘贴，这里保留 2px
         的可见区域并把透明度压到接近 0，既不影响观感又能可靠接收 paste。 */
      position: fixed; left: 0; top: 0; width: 2px; height: 2px;
      opacity: 0.01; border: 0; padding: 0; resize: none;
      z-index: -1; pointer-events: none;
    }
  </style>
</head>
<body>

<!-- 连接状态覆盖层 -->
<div id="overlay">
  <div class="spinner-ring"></div>
  <div id="statusMsg">正在连接桌面，请稍候…</div>
  <div id="errorMsg"></div>
</div>

<!-- 顶部工具栏 -->
<div id="topbar">
  <span class="bar-title">🖥 远程桌面 &mdash; <strong>{{ username }}</strong></span>
  <button class="bar-btn" id="btnClipboard" aria-expanded="false"
          title="剪贴板同步">📋 剪贴板<span id="clipBadge" class="badge" hidden>!</span></button>
  <button class="bar-btn" id="btnFullscreen">⛶ 全屏</button>
  <a href="/logout"><button class="bar-btn" id="btnLogout">断开</button></a>
</div>

<!-- 剪贴板面板 -->
<div id="clipPanel" aria-hidden="true">
  <div class="clip-head">
    <span>📋 剪贴板同步</span>
    <button class="clip-x" id="btnClipClose" title="关闭">×</button>
  </div>
  <div id="clipHint" class="clip-hint"></div>
  <textarea id="clipText" spellcheck="false"
            placeholder="远程复制的内容会显示在这里；在此粘贴文字会立即发送到远程。"></textarea>
  <div class="clip-actions">
    <button id="btnClipSend" class="primary">发送到远程</button>
    <button id="btnClipCopy">复制远程内容</button>
  </div>
  <div class="clip-foot">
    <label><input type="checkbox" id="clipAuto" checked> 自动同步到本机</label>
    <span id="clipStatus" class="clip-status">就绪</span>
  </div>
</div>

<!-- Toast 容器 -->
<div id="toasts" aria-live="polite"></div>

<!-- noVNC 渲染区域（隐藏的剪贴板捕获框放在里面，全屏时仍可聚焦） -->
<div id="vnc-container">
  <textarea id="clipScratch" tabindex="-1" aria-hidden="true"></textarea>
</div>

<!-- noVNC 核心库 -->
<script type="module">
import RFB from '/novnc_ws/core/rfb.js';

const WS_PORT  = {{ ws_port }};
const VNC_PASS = "{{ vnc_pass }}";
const host     = window.location.hostname;
const wsUrl    = `ws://${host}:${WS_PORT}/websockify`;

const $ = (id) => document.getElementById(id);

const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || '') ||
              (navigator.userAgentData && navigator.userAgentData.platform === 'macOS');

let rfb;

const clip = {
  // 只有 HTTPS / localhost 才能让网页自动写系统剪贴板
  secure: !!(window.isSecureContext && navigator.clipboard &&
             typeof navigator.clipboard.writeText === 'function'),
  auto: localStorage.getItem('vd.clipAuto') !== '0',
  version: -1,
  lastRemote: '',
  pendingRemote: '',
  connected: false,
  loopRunning: false,
  lastPushed: null,     // { text, at }：最近一次由本机推送到远程的文本
  lastGestureAt: 0,     // 最近一次用户手势时间（HTTP 下 execCommand('copy') 依赖它）
  capture: null,
  bridgeErrorShown: false,
};

// ── 小工具 ────────────────────────────────────────────────
function setStatus(message, kind = '') {
  const el = $('clipStatus');
  el.textContent = message;
  el.className = 'clip-status' + (kind ? ' ' + kind : '');
}

function setBadge(show) {
  $('clipBadge').hidden = !show;
  $('btnClipboard').classList.toggle('has-new', !!show);
}

function toast(message, opts = {}) {
  const wrap = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (opts.type === 'error' ? ' error' : '');
  const text = document.createElement('span');
  text.textContent = message;
  el.appendChild(text);

  let timer = null;
  const dismiss = () => {
    clearTimeout(timer);
    if (!el.isConnected) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 200);
  };

  if (opts.action) {
    const btn = document.createElement('button');
    btn.textContent = opts.action.label;
    btn.addEventListener('click', async () => {
      dismiss();
      try { await opts.action.run(); } catch (e) { console.error(e); }
    });
    el.appendChild(btn);
  }

  wrap.appendChild(el);
  timer = setTimeout(dismiss, opts.duration || 6000);
  return dismiss;
}

function isEditable(el) {
  if (!el) return false;
  const tag = (el.tagName || '').toUpperCase();
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

function updateHint() {
  const hint = $('clipHint');
  const pasteKey = isMac ? 'Cmd+V' : 'Ctrl+V';
  const copyKey = isMac ? 'Cmd+C' : 'Ctrl+C';
  if (clip.secure) {
    hint.textContent = `自动模式：远程复制后本机剪贴板会自动更新；在远程窗口按 ${pasteKey} 粘贴。远程复制使用 ${copyKey}（终端用 ${isMac ? 'Cmd+Shift+C' : 'Ctrl+Shift+C'}）。`;
    hint.className = 'clip-hint ok';
  } else {
    hint.textContent = `当前是 HTTP 访问：在远程窗口按 ${copyKey} 复制后通常会立即同步到本机；若浏览器拒绝（如远程程序自行修改剪贴板），点「复制远程内容」取回。本机 ${pasteKey} 会先同步到远程再粘贴。改用 HTTPS 可获得完全自动的同步。`;
    hint.className = 'clip-hint warn';
  }
}

// ── 本机剪贴板写入 ────────────────────────────────────────
// HTTP 页面没有 navigator.clipboard，只能用 execCommand('copy')，且必须在
// 用户手势后的短时间内（Chrome/Firefox 约 5 秒）调用。优先通过 copy 事件
// 写入数据：不需要移动焦点，不会打断 noVNC 的键盘状态。
function legacyCopy(text) {
  let handled = false;
  const onCopy = (e) => {
    if (!e.clipboardData) return;
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
    handled = true;
  };
  document.addEventListener('copy', onCopy, true);
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  document.removeEventListener('copy', onCopy, true);
  if (ok && handled) return true;
  return legacySelectCopy(text);
}

function legacySelectCopy(text) {
  const ta = $('clipScratch');
  ta.value = text;
  ta.focus({ preventScroll: true });
  ta.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  ta.value = '';
  ta.blur();
  if (rfb) rfb.focus({ preventScroll: true });
  return ok;
}

async function copyTextToLocal(text) {
  if (!text) return false;
  if (clip.secure) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // 权限被拒时退回到 execCommand（需要用户手势）
    }
  }
  return legacyCopy(text);
}

async function copyPendingRemote() {
  const text = clip.pendingRemote || clip.lastRemote || $('clipText').value;
  if (!text) {
    setStatus('远程剪贴板为空');
    return;
  }
  const ok = await copyTextToLocal(text);
  if (ok) {
    clip.pendingRemote = '';
    setBadge(false);
    setStatus('远程内容已复制到本机剪贴板');
    toast('已复制到本机剪贴板', { duration: 2500 });
  } else {
    setStatus('复制失败：浏览器未允许写入剪贴板', 'error');
    toast('复制失败，请在面板中手动选择文本复制', { type: 'error' });
  }
  if (rfb) rfb.focus({ preventScroll: true });
}

function inGestureWindow() {
  return Date.now() - clip.lastGestureAt < 4500;
}

// ── 远程剪贴板 -> 本机 ───────────────────────────────────
// force=true：服务端版本号变化即代表远程发生了一次复制，即使文本与上次相同
// 也要重新写入本机（期间本机可能复制过别的内容）。
async function onRemoteText(text, force = false) {
  if (typeof text !== 'string' || text === '') return;
  if (!force && text === clip.lastRemote) return;
  clip.lastRemote = text;
  clip.pendingRemote = text;

  if (document.activeElement !== $('clipText')) {
    $('clipText').value = text;
  }

  if (!clip.auto) {
    setBadge(true);
    setStatus('远程剪贴板已更新（自动同步已关闭）');
    return;
  }

  if (clip.secure) {
    try {
      await navigator.clipboard.writeText(text);
      clip.pendingRemote = '';
      setBadge(false);
      setStatus('已自动同步远程内容到本机剪贴板');
      toast('已同步远程剪贴板', { duration: 2200 });
      return;
    } catch (e) {
      // 权限不足或页面失焦，再尝试 execCommand，最后降级为手动复制
    }
  }

  // 远程复制通常由页面内的 Ctrl/Cmd+C 或鼠标菜单触发，此时仍处于用户手势
  // 有效期内，可直接用 execCommand('copy') 写入本机剪贴板（HTTP 也可用）。
  if (inGestureWindow() && document.hasFocus() &&
      !isEditable(document.activeElement) && legacyCopy(text)) {
    clip.pendingRemote = '';
    setBadge(false);
    setStatus('已自动同步远程内容到本机剪贴板');
    toast('已同步远程剪贴板', { duration: 2200 });
    return;
  }

  setBadge(true);
  setStatus('远程剪贴板已更新，点击「复制远程内容」取回');
  toast('远程剪贴板已更新', {
    action: { label: '复制到本机', run: copyPendingRemote },
    duration: 8000,
  });
}

// ── 本机剪贴板 -> 远程 ───────────────────────────────────
async function pushToRemote(text) {
  if (typeof text !== 'string' || text === '') {
    setStatus('没有可发送的文本');
    return false;
  }
  setStatus('正在同步到远程…');
  // 先登记，避免长轮询先于 POST 响应拿到这次写入，被误当成“远程复制”回写本机
  clip.lastPushed = { text, at: Date.now() };
  try {
    const res = await fetch('/api/clipboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      throw new Error(data.error || ('HTTP ' + res.status));
    }
    // 不用 POST 返回的版本号直接推进 clip.version：远程桌面可能在同一
    // 时刻又修改了剪贴板，交给下一次轮询读取真实状态更稳妥。
    clip.lastRemote = text;
    clip.lastPushed = { text, at: Date.now() };
    clip.pendingRemote = '';
    setBadge(false);
    setStatus(`已发送到远程剪贴板（${text.length} 字符）`);
    return true;
  } catch (err) {
    const message = err.message === 'clipboard_bridge_unavailable'
      ? '服务端剪贴板桥不可用，请检查 remote_desktop/clipboard_bridge.log'
      : '发送到远程失败：' + err.message;
    setStatus(message, 'error');
    toast(message, { type: 'error' });
    return false;
  }
}

// ── 长轮询远程剪贴板 ─────────────────────────────────────
// 服务端在版本号变化前挂起请求（最多 20 秒），远程一复制就立即返回。
// 只运行一个循环，避免重复轮询。
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function isOwnEcho(text) {
  return !!clip.lastPushed && clip.lastPushed.text === text &&
         Date.now() - clip.lastPushed.at < 5000;
}

async function clipboardLoop() {
  if (clip.loopRunning) return;
  clip.loopRunning = true;
  let failures = 0;
  try {
    while (clip.connected) {
      let ok = false;
      try {
        const wait = clip.version === -1 ? 0 : 20;
        const res = await fetch(`/api/clipboard?since=${clip.version}&wait=${wait}`,
                                { cache: 'no-store' });
        if (res.status === 401) {
          window.location.href = '/';
          return;
        }
        if (res.status === 503) {
          if (!clip.bridgeErrorShown) {
            clip.bridgeErrorShown = true;
            setStatus('服务端剪贴板桥未就绪', 'error');
          }
        } else if (res.ok) {
          ok = true;
          clip.bridgeErrorShown = false;
          await handleClipboardState(await res.json());
        }
      } catch (e) {
        // 网络抖动：退避后继续
      }
      failures = ok ? 0 : failures + 1;
      if (failures) await sleep(Math.min(500 * failures, 5000));
    }
  } finally {
    clip.loopRunning = false;
  }
}

async function handleClipboardState(data) {
  // 用 !== 而不是 >：剪贴板桥状态被清理后版本号可能回到较小值
  if (typeof data.version !== 'number' || data.version === clip.version) return;
  const firstSync = clip.version === -1;
  clip.version = data.version;
  if (typeof data.text !== 'string' || data.text === '') return;

  if (firstSync) {
    // 页面刚打开时只展示远程剪贴板，不覆盖用户本机原有内容；
    // 之后的远程复制再自动同步。
    clip.lastRemote = data.text;
    clip.pendingRemote = data.text;
    if (document.activeElement !== $('clipText')) {
      $('clipText').value = data.text;
    }
    setBadge(true);
    setStatus('已载入远程剪贴板，点击「复制远程内容」取回');
    return;
  }
  if (isOwnEcho(data.text)) {
    // 本机刚推送到远程的内容，本机剪贴板里已经是它了
    clip.lastRemote = data.text;
    return;
  }
  await onRemoteText(data.text, true);
}

// ── 远程按键状态 ─────────────────────────────────────────
// noVNC 在修饰键按下时就已把它发给远程（macOS 的 Cmd 会被映射成 Alt）。
// 我们改发 Ctrl+C / Ctrl+V 之前必须先松开这些修饰键，否则远程收到的是
// Alt+Ctrl+V 之类的组合，粘贴/复制不生效。
const MODIFIER_CODE = /^(Control|Shift|Alt|Meta|OS)(Left|Right)$|^AltGraph$/;

function remoteKeyboard() {
  return rfb && rfb._keyboard && rfb._keyboard._keyDownList ? rfb._keyboard : null;
}

function releaseRemoteModifiers() {
  const kb = remoteKeyboard();
  if (!kb) return;
  if (kb._altGrArmed) {
    // Windows 上 Ctrl 会被延迟 100ms 发送（AltGr 检测），取消它以免之后卡住
    kb._altGrArmed = false;
    clearTimeout(kb._altGrTimeout);
  }
  for (const code of Object.keys(kb._keyDownList)) {
    if (MODIFIER_CODE.test(code)) kb._sendKeyEvent(kb._keyDownList[code], code, false);
  }
}

// 粘贴时焦点会临时移到隐藏输入框，松键事件不再经过 noVNC 的 canvas，
// 远程会一直以为该键按着。这里替 noVNC 补发松键。
function handleStrayKeyup(e) {
  const kb = remoteKeyboard();
  if (!kb || e.target === rfb._canvas) return;
  const code = e.code;
  if (code && code in kb._keyDownList) kb._sendKeyEvent(kb._keyDownList[code], code, false);
}

// macOS 客户端的 Cmd+C 是本机习惯；远程 Linux/X11 应用使用 Ctrl+C。
// 映射标准复制组合，同时保留 Shift（例如终端的 Cmd+Shift+C）。
function sendRemoteCtrlChord(keysym, code, shift = false) {
  if (!rfb) return;
  releaseRemoteModifiers();
  try {
    rfb.sendKey(0xFFE3, 'ControlLeft', true);
    if (shift) rfb.sendKey(0xFFE1, 'ShiftLeft', true);
    rfb.sendKey(keysym, code, true);
    rfb.sendKey(keysym, code, false);
    if (shift) rfb.sendKey(0xFFE1, 'ShiftLeft', false);
    rfb.sendKey(0xFFE3, 'ControlLeft', false);
  } catch (e) {
    console.error('sendRemoteCtrlChord failed', e);
  }
}

// ── 客户端原生粘贴快捷键：读取本机剪贴板，再粘贴到远程 ──
function handlePasteKeydown(e) {
  if (!clip.connected) return;
  if (isEditable(e.target)) return;   // 面板输入框走浏览器原生剪贴板操作
  const key = String(e.key || '').toLowerCase();

  // 浏览器使用客户端操作系统的快捷键；非本机惯例组合不拦截，直接交给 noVNC。
  // macOS 的 Cmd+C / Cmd+X 映射成远程 Linux 的 Ctrl+C / Ctrl+X。
  if (isMac && e.metaKey && !e.ctrlKey && !e.altKey && (key === 'c' || key === 'x')) {
    e.preventDefault();
    e.stopImmediatePropagation();
    if (key === 'c') sendRemoteCtrlChord(0x63, 'KeyC', !!e.shiftKey);
    else sendRemoteCtrlChord(0x78, 'KeyX', !!e.shiftKey);
    return;
  }

  const nativePaste = isMac
    ? e.metaKey && !e.ctrlKey
    : e.ctrlKey && !e.metaKey;
  if (!nativePaste || e.altKey || key !== 'v') return;

  // noVNC 会把按键转发到远程系统；稍后根据远程 Linux/X11 环境发送
  // Ctrl+V，终端组合则保留 Shift。此处不 preventDefault，保留浏览器 paste 事件。
  if (clip.capture) {
    // 上一次粘贴还在同步中，吞掉重复按键，避免把旧内容立刻粘到远程
    e.preventDefault();
    e.stopImmediatePropagation();
    return;
  }

  // 阻止 noVNC 立刻把粘贴快捷键发到远程（否则会粘贴旧内容）。
  // 不 preventDefault，让浏览器仍生成原生 paste 事件。
  e.stopImmediatePropagation();

  // 将焦点交给可接收 paste 的捕获框；document 捕获监听器同时兜底浏览器
  // 把 paste 事件发到 canvas/body 的情况。HTTP 页面只能通过该事件读剪贴板。
  const scratch = $('clipScratch');
  scratch.value = '';
  scratch.focus({ preventScroll: true });

  // Clipboard API 的读取必须在真实用户手势期间发起；等到 paste 超时后再调用，
  // 在部分浏览器里用户激活已经失效。HTTP 页面不支持该 API，仍由 paste 事件兜底。
  let readPromise = null;
  if (clip.secure) {
    try {
      readPromise = navigator.clipboard.readText().catch(() => '');
    } catch (e) {
      readPromise = Promise.resolve('');
    }
  }

  const capture = { shift: !!e.shiftKey, timer: null, readPromise };
  clip.capture = capture;
  setStatus('正在读取本机剪贴板…');

  capture.timer = setTimeout(() => {
    if (clip.capture === capture) {
      finishPasteCapture(null, capture, true);
    }
  }, 250);
}

function handleScratchPaste(e) {
  if (!clip.capture) return;
  e.preventDefault();
  const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  const capture = clip.capture;
  clearTimeout(capture.timer);
  finishPasteCapture(text, capture, false);
}

// macOS/Safari 不一定把 Cmd+V 的 paste 事件重新定位到我们刚聚焦的隐藏输入框；
// 此时 paste 会落在原来的 canvas/body 上。在 document 捕获阶段兜底读取。
function handleDocumentPaste(e) {
  if (!clip.capture) return;
  if (isEditable(e.target)) return;   // 面板输入框交给它自己的 paste 处理
  e.preventDefault();
  const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  const capture = clip.capture;
  clearTimeout(capture.timer);
  finishPasteCapture(text, capture, false);
}

async function finishPasteCapture(text, capture, timedOut) {
  if (clip.capture !== capture) return;
  clip.capture = null;
  const shift = capture.shift;

  const scratch = $('clipScratch');
  scratch.value = '';
  if (rfb) rfb.focus({ preventScroll: true });

  if (!text && capture.readPromise) {
    // 优先使用按键时已启动的读取请求：部分浏览器不会把 paste 事件
    // 投递到隐藏输入框，或会在 paste 事件中不给 clipboardData 文本。
    try {
      text = await capture.readPromise;
    } catch (e) {
      text = '';
    }
  }

  let canPaste = false;
  if (text) {
    canPaste = await pushToRemote(text);
    if (canPaste) setStatus('已同步并粘贴到远程');
  } else if (timedOut) {
    setStatus('未读取到本机剪贴板，未向远程发送粘贴键', 'error');
    toast(isMac
      ? '未能读取本机剪贴板：请检查浏览器剪贴板权限，或打开「📋」面板，在文本框中按 Cmd+V 后发送'
      : '未能读取本机剪贴板：请检查浏览器剪贴板权限，或打开「📋」面板，在文本框中粘贴后发送', {
      type: 'error', duration: 8000,
    });
  } else {
    setStatus('剪贴板中没有可粘贴的文本', 'error');
  }

  // 只有确认远程 CLIPBOARD 已更新后才发送按键，避免失败时误粘贴旧内容。
  if (canPaste) sendPasteChord(shift);
}

function sendPasteChord(shift) {
  sendRemoteCtrlChord(0x76, 'KeyV', shift);
}

// ── 面板交互 ─────────────────────────────────────────────
function openPanel() {
  $('clipPanel').classList.add('open');
  $('clipPanel').setAttribute('aria-hidden', 'false');
  $('btnClipboard').classList.add('active');
  $('btnClipboard').setAttribute('aria-expanded', 'true');
  // 点击本身是用户手势，此时可以直接把待复制的远程内容写入剪贴板
  if (clip.pendingRemote) copyPendingRemote();
}

function closePanel() {
  $('clipPanel').classList.remove('open');
  $('clipPanel').setAttribute('aria-hidden', 'true');
  $('btnClipboard').classList.remove('active');
  $('btnClipboard').setAttribute('aria-expanded', 'false');
  if (rfb) rfb.focus({ preventScroll: true });
}

$('btnClipboard').addEventListener('click', () => {
  if ($('clipPanel').classList.contains('open')) closePanel();
  else openPanel();
});
$('btnClipClose').addEventListener('click', closePanel);

$('btnClipSend').addEventListener('click', async () => {
  await pushToRemote($('clipText').value);
  if (rfb) rfb.focus({ preventScroll: true });
});

$('btnClipCopy').addEventListener('click', copyPendingRemote);

$('clipAuto').checked = clip.auto;
$('clipAuto').addEventListener('change', (e) => {
  clip.auto = e.target.checked;
  localStorage.setItem('vd.clipAuto', clip.auto ? '1' : '0');
  setStatus(clip.auto ? '已开启自动同步' : '已关闭自动同步');
  if (clip.auto && clip.pendingRemote) copyPendingRemote();
});

// 在面板里粘贴时，把内容自动同步到远程
$('clipText').addEventListener('paste', () => {
  setTimeout(() => {
    const text = $('clipText').value;
    if (text) pushToRemote(text);
  }, 0);
});

$('clipText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    pushToRemote($('clipText').value);
  }
});

$('clipScratch').addEventListener('paste', handleScratchPaste);
document.addEventListener('paste', handleDocumentPaste, true);

// 必须先于 handlePasteKeydown 注册：后者会 stopImmediatePropagation
function markUserGesture() { clip.lastGestureAt = Date.now(); }
window.addEventListener('pointerdown', markUserGesture, true);
window.addEventListener('keydown', markUserGesture, true);
window.addEventListener('touchstart', markUserGesture, true);

window.addEventListener('keydown', handlePasteKeydown, true);
window.addEventListener('keyup', handleStrayKeyup, true);

// 页面重新获得焦点时，重试待复制的远程内容（远程复制后立刻切走时会出现）
window.addEventListener('focus', () => {
  // HTTP 下 focus 不算可靠的用户手势，等用户点「📋」时再复制
  if (clip.auto && clip.pendingRemote && clip.secure) copyPendingRemote();
});

// ── noVNC 连接 ───────────────────────────────────────────
function showError(msg) {
  document.getElementById('statusMsg').style.display = 'none';
  const e = document.getElementById('errorMsg');
  e.textContent = '⚠ ' + msg;
  e.style.display = 'block';
}

function connect() {
  const container = document.getElementById('vnc-container');

  rfb = new RFB(container, wsUrl, {
    credentials: { password: VNC_PASS },
    // 自动等比缩放贴合浏览器屏幕，实现自适应分辨率
    scaleViewport: true,
    resizeSession: false,
    clipViewport: false,
    shared: true,
  });

  rfb.addEventListener('clipboard', (e) => {
    // noVNC 原生 RFB 剪贴板（Xvnc 等支持该特性的服务端）。
    // 与后端轮询结果做去重，不会重复提示。
    if (e.detail && typeof e.detail.text === 'string') {
      onRemoteText(e.detail.text);
    }
  });

  rfb.addEventListener('connect', () => {
    clip.connected = true;
    document.getElementById('overlay').classList.add('hidden');
    updateHint();
    if (rfb) rfb.focus({ preventScroll: true });
    // 自动隐藏顶栏（鼠标移近时显示）
    setTimeout(hideTopbar, 3000);
    sendViewportSize();
    // 立即获取一次当前远程剪贴板，然后开始长轮询
    clipboardLoop();
    // 保持会话活跃
    setInterval(() => fetch('/api/keepalive', { method: 'POST' }), 60000);
  });

  rfb.addEventListener('disconnect', (e) => {
    clip.connected = false;
    document.getElementById('overlay').classList.remove('hidden');
    if (e.detail.clean) {
      showError('桌面会话已断开');
    } else {
      showError('连接意外中断，请刷新页面重试');
    }
  });

  rfb.addEventListener('credentialsrequired', () => {
    rfb.sendCredentials({ password: VNC_PASS });
  });
}

// 通知 noVNC 视口大小改变（实现自适应分辨率）
function sendViewportSize() {
  if (!rfb) return;
  rfb.scaleViewport = true;
  rfb.resizeSession = true;
}

window.addEventListener('resize', sendViewportSize);

// ── 全屏 ──
document.getElementById('btnFullscreen').addEventListener('click', () => {
  const el = document.getElementById('vnc-container');
  if (!document.fullscreenElement) {
    el.requestFullscreen().catch(() => document.documentElement.requestFullscreen());
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener('fullscreenchange', () => {
  if (rfb) rfb.focus({ preventScroll: true });
});

// ── 顶栏自动隐藏 ──
let hideTimer = null;
function hideTopbar() {
  if ($('clipPanel').classList.contains('open')) return;
  $('topbar').classList.add('hidden');
}
document.addEventListener('mousemove', (e) => {
  const bar = $('topbar');
  if (e.clientY < 50 || $('clipPanel').classList.contains('open')) {
    bar.classList.remove('hidden');
    clearTimeout(hideTimer);
  } else {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideTopbar, 2000);
  }
});

// 初始化
updateHint();
setStatus('就绪');
connect();
</script>
</body>
</html>
